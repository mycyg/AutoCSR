# Cardiovascular CSR principle (M20 v2.2) — MACE composite endpoint,
# CV risk subgroup, LVEF + NT-proBNP biomarkers, 6MWT functional outcome
# per ICH E9 estimands + FDA CV outcome trial guidance + ESC guidelines.

meta:
  id: cardiovascular
  name: Cardiovascular CSR (MACE + CV biomarkers + functional capacity)
  version: "1.0"
  scope: [cardiovascular, heart-failure, atherosclerosis, antithrombotic]
  derives_from: ich_e3

sections:
  - id: "1"
    title: "Title Page"
    required: true
    requirements:
      - "Indication (HFrEF / HFpEF / ACS / chronic CAD / arrhythmia), drug class, sponsor, phase"
    stat_hints: []
    children: []

  - id: "2"
    title: "Synopsis"
    required: true
    requirements:
      - "Primary composite endpoint (MACE 3-pt: CV death + MI + stroke; or 4-pt + hosp for HF)"
      - "Median follow-up; cumulative event rate per arm; HR with 95% CI"
      - "Key safety: bleeding (BARC 3-5), hypotension, renal dysfunction"
    stat_hints:
      - "HR (95% CI) for primary composite; KM event rates at 1/3/5 years"
    children: []

  - id: "3"
    title: "Background"
    required: true
    requirements:
      - "CV disease burden + epidemiology in target indication"
      - "Standard-of-care therapy + residual risk"
      - "Mechanistic rationale for investigational product"
    stat_hints: []
    children: []

  - id: "4"
    title: "Objectives"
    required: true
    requirements: []
    stat_hints: []
    children:
      - id: "4.1"
        title: "Primary CV Outcome Objective"
        requirements:
          - "Demonstrate superiority (or non-inferiority margin pre-specified) for primary composite endpoint"
        stat_hints: []
        children: []
      - id: "4.2"
        title: "Secondary CV + Safety Objectives"
        requirements:
          - "Individual MACE components, total CV hospitalizations, all-cause mortality"
          - "Bleeding outcomes (BARC scale, TIMI scale, ISTH scale)"
        stat_hints: []
        children: []

  - id: "5"
    title: "Study Design"
    required: true
    requirements:
      - "Event-driven trial design (number of primary events triggers analysis, not fixed N)"
      - "Randomization stratification (history of MI, eGFR strata, region, baseline therapy)"
      - "Double-blind, event adjudication by blinded CEC (Clinical Endpoint Committee)"
    stat_hints: []
    children: []

  - id: "6"
    title: "Population"
    required: true
    requirements:
      - "CV risk factors at entry (prior MI, prior stroke, diabetes, CKD)"
      - "Excluded: NYHA IV (for some HF trials), eGFR <30, severe valvular disease"
      - "Background therapy requirements (statin, antiplatelet, RAAS-inhibitor)"
    stat_hints: []
    children: []

  - id: "7"
    title: "Primary Composite Endpoint — MACE"
    required: true
    requirements: []
    stat_hints: []
    children:
      - id: "7.1"
        title: "MACE Definition"
        requirements:
          - "3-point MACE: CV death + non-fatal MI + non-fatal stroke"
          - "4-point MACE: + hospitalization for HF (or unstable angina, or coronary revascularization per protocol)"
          - "Components defined by Standardized Definitions (CDISC SDTM TR + FDA CV definitions 2017)"
        stat_hints:
          - "Time to first MACE component; if competing risks, also report cumulative incidence"
        children: []
      - id: "7.2"
        title: "Event Adjudication"
        requirements:
          - "Blinded CEC reviews all suspected events with standard documentation packet"
          - "Concordance with investigator-reported events"
        stat_hints:
          - "Adjudication agreement rate; reclassification table"
        children: []
      - id: "7.3"
        title: "Primary Analysis"
        requirements:
          - "Cox proportional hazards with stratification factors; HR with 95% CI"
          - "Proportional hazards assumption check (Schoenfeld residuals)"
        stat_hints:
          - "HR (95% CI), log-rank p; KM curves with risk table"
          - "ADaM cols: PARAMCD=MACE, AVAL=days, CNSR (0=event, 1=censor), EVNTDESC"
          - "Plot: KM with cumulative incidence + risk table at 0/6/12/18/24 months"
        children: []

  - id: "8"
    title: "Individual MACE Components"
    required: true
    requirements:
      - "Time-to-event analyses for each component separately"
    stat_hints:
      - "CV death: KM + HR"
      - "Non-fatal MI: KM + HR (UDMI Type 1, Type 2 split if relevant)"
      - "Non-fatal stroke: KM + HR (ischemic vs hemorrhagic split)"
      - "Cumulative incidence functions with Gray's test for competing risks"
    children: []

  - id: "9"
    title: "Total Events Analysis (Recurrent Events)"
    required: false
    requirements:
      - "Andersen-Gill / LWYY model for total CV events including repeat hospitalizations"
    stat_hints:
      - "Rate ratio with 95% CI; mean cumulative function plot"
    children: []

  - id: "10"
    title: "CV Biomarkers + Functional Outcomes"
    required: true
    requirements: []
    stat_hints: []
    children:
      - id: "10.1"
        title: "LVEF (Left Ventricular Ejection Fraction)"
        requirements:
          - "Method: echocardiography vs MRI vs MUGA; central reading lab"
          - "Baseline + Q3-6M assessments"
        stat_hints:
          - "Mean change from baseline per visit by arm (MMRM)"
          - "Proportion with ≥5% absolute increase / ≥10% decrease"
          - "ADaM cols: PARAMCD=LVEF, AVAL, BASE, CHG, AVISIT, AVISITN"
        children: []
      - id: "10.2"
        title: "NT-proBNP / BNP"
        requirements:
          - "Log-transformed for analysis given right-skewed distribution"
        stat_hints:
          - "Geometric mean ratio per visit (drug vs placebo)"
          - "Proportion achieving 30% reduction; ADaM cols: PARAMCD=NTPROBNP, AVAL"
        children: []
      - id: "10.3"
        title: "Troponin (hs-cTnI / hs-cTnT)"
        requirements:
          - "For ACS trials + myocardial injury assessment"
        stat_hints:
          - "Median change with IQR; proportion above 99th percentile URL"
        children: []
      - id: "10.4"
        title: "6-Minute Walk Test (6MWT)"
        requirements:
          - "Distance walked in meters; standardized protocol (ATS/ERS)"
        stat_hints:
          - "Mean change from baseline per visit (MMRM); MCID ≥30m"
        children: []
      - id: "10.5"
        title: "NYHA Functional Class"
        requirements:
          - "I / II / III / IV classification at each visit"
        stat_hints:
          - "Shift table (baseline → endpoint) by arm"
          - "Proportion with improvement / no change / worsening"
        children: []
      - id: "10.6"
        title: "KCCQ (Kansas City Cardiomyopathy Questionnaire)"
        requirements: []
        stat_hints:
          - "Overall summary score mean change from baseline (MCID ≥5 points)"
        children: []

  - id: "11"
    title: "Subgroup Analyses — CV Risk Strata"
    required: true
    requirements:
      - "Pre-specified: age (<65, ≥65, ≥75), sex, region (NA / EU / Asia / Latam),"
      - "  eGFR strata (≥60, 30-60, <30), diabetes, prior MI, ejection fraction strata,"
      - "  NYHA class, baseline NT-proBNP terciles"
    stat_hints:
      - "Forest plot of HR by subgroup with 95% CI; interaction p-values"
      - "Heterogeneity assessment via Cochrane Q + I²"
    children: []

  - id: "12"
    title: "Safety Evaluation"
    required: true
    requirements: []
    stat_hints: []
    children:
      - id: "12.1"
        title: "Bleeding"
        requirements:
          - "BARC type 1-5 classification; TIMI major + minor; ISTH major bleeding"
          - "Intracranial hemorrhage as separate category"
        stat_hints:
          - "Annualized bleeding rate per arm; HR with 95% CI for primary bleeding endpoint"
          - "Net clinical benefit composite: MACE + major bleeding"
        children: []
      - id: "12.2"
        title: "Hypotension + Syncope"
        requirements:
          - "Symptomatic hypotension events; SBP / DBP measurement summaries"
        stat_hints:
          - "Mean change in SBP / DBP per visit; proportion with SBP <90 mmHg events"
        children: []
      - id: "12.3"
        title: "Renal Function (eGFR + ACR)"
        requirements:
          - "CKD-EPI eGFR per visit; acute kidney injury events"
        stat_hints:
          - "Mean change in eGFR per visit; proportion with ≥30% / ≥40% / ≥50% decline"
          - "ADaM cols: PARAMCD=EGFR, AVAL, CHGPCT"
        children: []
      - id: "12.4"
        title: "Hyperkalemia"
        requirements:
          - "K+ >5.5, >6.0 mmol/L; discontinuations due to hyperkalemia"
        stat_hints:
          - "Incidence by threshold; ADaM cols: LBTEST=POTASSIUM, LBSTRESN"
        children: []
      - id: "12.5"
        title: "Adverse Events"
        requirements:
          - "AE by MedDRA SOC × PT × severity × arm; CV AEs of interest separately"
        stat_hints:
          - "AE n (%) by arm; ADaM cols: AESOC, AETERM, AESEV, AESER, AEREL"
        children: []

  - id: "13"
    title: "Sensitivity Analyses"
    required: true
    requirements:
      - "Per-protocol analysis; on-treatment vs ITT comparison"
      - "Multiple imputation for missing covariates"
      - "Tipping-point analysis for primary endpoint robustness"
    stat_hints:
      - "Side-by-side primary vs sensitivity HR estimates"
      - "Bland-Altman for repeat measurements consistency"
    children: []

  - id: "14"
    title: "Cardiovascular Pharmacodynamics"
    required: false
    requirements:
      - "ECG (QTcF, PR, QRS) per visit"
      - "BP / HR profile (24-hr ambulatory BP if relevant)"
    stat_hints:
      - "Mean change in QTcF; proportion >450ms / >500ms; outlier listings"
    children: []

  - id: "15"
    title: "Statistical Methods Summary"
    required: true
    requirements:
      - "Analysis populations (ITT / on-treatment / per-protocol / safety)"
      - "Multiplicity strategy: hierarchical testing across primary + key secondaries"
      - "Interim analyses + stopping boundaries (DSMB charter reference)"
      - "Estimand framework per ICH E9(R1) for treatment effect of interest"
    stat_hints: []
    children: []

  - id: "16"
    title: "Discussion + Benefit-Risk"
    required: true
    requirements:
      - "Net clinical benefit including MACE reduction vs bleeding harm"
      - "Comparison with class effects + recent trials in similar population"
    stat_hints: []
    children: []

  - id: "17"
    title: "References"
    required: true
    requirements:
      - "Vancouver; include ICH E9(R1) estimands, FDA CV outcome trial guidance,"
      - "  ESC HF / ACS guidelines, Standardized Definitions for CV Endpoint Events"
    stat_hints: []
    children: []

  - id: "18"
    title: "Appendices"
    required: true
    requirements: []
    stat_hints: []
    children:
      - id: "18.1"
        title: "Protocol + SAP + CEC Charter + DSMB Charter"
        requirements: []
        children: []
      - id: "18.2"
        title: "Event Adjudication Definitions + Forms"
        requirements: []
        children: []
      - id: "18.3"
        title: "Patient Listings (MACE Events, Deaths, Bleeding Events)"
        requirements: []
        children: []
