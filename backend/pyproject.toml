[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocsr-backend"
version = "0.1.0"
description = "AutoCSR backend — ICH E3 / NMPA clinical study report generator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "markdown>=3.5",
    "rapidfuzz>=3.0",
    "beautifulsoup4>=4.12",
    "websockets>=12.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "lifelines>=0.27",
    "tabulate>=0.9",
    "numpy>=1.26",
    "structlog>=24.0",
    "filelock>=3.13",
    "psutil>=5.9",
    "matplotlib>=3.7",
    "plotly>=5.20",
    "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "requests>=2.32"]
queue = ["arq>=0.26"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
