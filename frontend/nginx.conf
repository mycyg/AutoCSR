# AutoCSR frontend nginx config.
# - Serves the Vite SPA build with HTML5 fallback.
# - Proxies /api/* to the backend container (host: backend, port: 8766).
# - Proxies /ws/* (WebSocket) to the same backend with upgrade headers.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Lightweight healthcheck for the LB / docker compose healthcheck.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Static assets (vite hashed filenames) — long-lived cache.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — let vue-router handle the URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI routes.
    location /api/ {
        proxy_pass http://backend:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 200m;
    }

    # WebSocket — same backend, upgrade headers required.
    location /ws/ {
        proxy_pass http://backend:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Prometheus exposition (optional — backend mounts /metrics at root).
    location = /metrics {
        proxy_pass http://backend:8766/metrics;
        proxy_set_header Host $host;
        access_log off;
    }
}
