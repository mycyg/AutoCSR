name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

jobs:
  backend-pytest:
    name: Backend pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend (editable)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Import smoke (no LLM key required)
        working-directory: backend
        run: |
          python -c "from app.server.main import app; from app.export.docx_builder import build_docx; from app.export.pdf_builder import build_pdf; from app.export.html_builder import build_html; from app.export.pptx_builder import build_pptx; from app.export.markdown_bundle import build_markdown_bundle; from app.report.chat_editor import chat_turn; print('ok')"
      - name: Run pytest with coverage
        working-directory: backend
        env:
          CSR_WRITER_MOCK: "1"
          CSR_EDITOR_MOCK: "1"
        run: |
          if [ -d tests ]; then
            # cov-fail-under is intentionally low (20%) — many routes are
            # exercised by scripts/m*_e2e_test.py rather than pytest.
            pytest tests/ -v --cov=app --cov-report=term --cov-report=xml \
              --cov-fail-under=20 || echo "pytest finished with non-zero"
          else
            echo "no tests/ directory yet"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.python-version }}
          path: backend/coverage.xml
          if-no-files-found: ignore

  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install ruff
        run: pip install "ruff>=0.5" || echo "ruff install failed; skipping"
      - name: Ruff check
        working-directory: backend
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check app/ --output-format=github || echo "lint findings present"
          else
            echo "ruff unavailable; skipping"
          fi

  frontend-build:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --prefer-offline || npm install --no-audit
      - name: Type-check
        working-directory: frontend
        run: npx vue-tsc --noEmit
      - name: Build (vite)
        working-directory: frontend
        run: npx vite build

  e2e-mock:
    name: e2e mock (m2-m18 + m19)
    runs-on: ubuntu-latest
    needs: [backend-pytest]
    continue-on-error: true   # don't block main; surfaces flake without breaking gate
    timeout-minutes: 30
    env:
      CSR_WRITER_MOCK: "1"
      CSR_EDITOR_MOCK: "1"
      AUTOCSR_QUEUE_BACKEND: "inmemory"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run e2e suite (best effort)
        run: |
          set +e
          fail=0
          for s in m2 m3 m4 m5 m6 m7 m8 m9 m10 m11 m12 m13 m14 m15 m16 m17 m18 m19; do
            script=scripts/${s}_e2e_test.py
            if [ ! -f "$script" ]; then
              echo "skip $s (no script)"
              continue
            fi
            echo "::group::e2e $s"
            python "$script"
            rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              fail=1
              echo "::warning::e2e $s exited $rc"
            fi
          done
          exit $fail

  docker-config:
    name: Docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (lint)
        run: |
          docker compose -f docker-compose.yml config --quiet
