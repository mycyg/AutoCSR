name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend (editable)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Import smoke (no LLM key required)
        working-directory: backend
        run: |
          python -c "from app.server.main import app; from app.export.docx_builder import build_docx; from app.report.chat_editor import chat_turn; print('ok')"
      - name: Optional pytest
        working-directory: backend
        run: |
          if [ -d tests ]; then pytest -q; else echo "no tests/ directory yet"; fi

  frontend:
    name: Frontend (Node 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --prefer-offline || npm install --no-audit
      - name: Build (vue-tsc + vite)
        working-directory: frontend
        run: npm run build
